version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://marketplace:marketplace@postgres:5432/marketplace?sslmode=disable",
        "up",
      ]

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://marketplace:marketplace@postgres:5432/marketplace?sslmode=disable"
      JWT_SECRET: "super-secret-key-change-in-production"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "720h"
      ORDER_RATE_LIMIT_MINUTES: "1"
      SERVER_PORT: "8080"

volumes:
  pgdata:
