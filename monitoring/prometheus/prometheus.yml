global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: booking-service
    metrics_path: /metrics
    static_configs:
      - targets: ["booking-service:8080"]

  - job_name: flight-service
    metrics_path: /metrics
    static_configs:
      - targets: ["flight-service:9090"]

  - job_name: postgres-flight
    static_configs:
      - targets: ["postgres-exporter-flight:9187"]

  - job_name: postgres-booking
    static_configs:
      - targets: ["postgres-exporter-booking:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
